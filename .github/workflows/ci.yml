name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BIN_NAME: wg-friend

jobs:
  prepare:
    name: prepare-release-metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      release_tag: ${{ steps.release_meta.outputs.release_tag }}
      release_name: ${{ steps.release_meta.outputs.release_name }}
      prerelease: ${{ steps.release_meta.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          VERSION="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' Cargo.toml | head -n1)"
          if [[ -z "${VERSION}" ]]; then
            echo "Failed to resolve version from Cargo.toml" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_NAME="Release(v${VERSION})"
            PRERELEASE="false"
          else
            RELEASE_TAG="staging"
            RELEASE_NAME="Staging(v${VERSION})"
            PRERELEASE="true"
          fi

          {
            echo "version=${VERSION}"
            echo "release_tag=${RELEASE_TAG}"
            echo "release_name=${RELEASE_NAME}"
            echo "prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: build-${{ matrix.id }}
    needs: prepare
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runs_on: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_suffix: linux-x64
            archive_format: tar.gz
            bin_ext: ""
            rustflags: -C target-cpu=x86-64-v3
            apt_packages: musl-tools ca-certificates
          - id: windows-x64
            runs_on: windows-latest
            target: x86_64-pc-windows-msvc
            asset_suffix: windows-x64
            archive_format: zip
            bin_ext: .exe
            rustflags: -C target-cpu=x86-64-v3
            apt_packages: ""

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt_packages }}
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Generate Cargo cache manifest
        run: |
          mkdir -p .ci

          sed -E '
            /^\[package\]/,/^\[/ {
              /^[[:space:]]*version[[:space:]]*=/d
            }
            /^[[:space:]]*canonical_version[[:space:]]*=/d
          ' Cargo.toml > .ci/Cargo.cache.toml

          cat .ci/Cargo.cache.toml

      - name: Rust Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('.ci/Cargo.cache.toml', 'rust-toolchain.toml', 'rust-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build release binary
        env:
          CARGO_TERM_COLOR: always
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifact
        id: package
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          PACKAGE_ROOT="package/${BIN_NAME}"
          ASSET_NAME="${BIN_NAME}-v${VERSION}-${{ matrix.asset_suffix }}.${{ matrix.archive_format }}"

          mkdir -p dist "${PACKAGE_ROOT}"
          cp README.md LICENSE "${PACKAGE_ROOT}/"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.bin_ext }}" "${PACKAGE_ROOT}/"

          if [[ "${{ matrix.archive_format }}" == "zip" ]]; then
            (
              cd "${PACKAGE_ROOT}"
              7z a -tzip "${GITHUB_WORKSPACE}/dist/${ASSET_NAME}" ./*
            )
          else
            tar -C package -czf "dist/${ASSET_NAME}" "${BIN_NAME}"
          fi

          echo "asset_name=${ASSET_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.id }}
          path: dist/${{ steps.package.outputs.asset_name }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: upload-release-assets
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        if: needs.prepare.outputs.prerelease == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Refresh staging tag
        if: needs.prepare.outputs.prerelease == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ needs.prepare.outputs.release_tag }}" "${GITHUB_SHA}"
          git push origin "refs/tags/${{ needs.prepare.outputs.release_tag }}" --force

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Show assets
        run: ls -lah release-assets

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease != 'true' }}
          body: |
            Automated build for `${{ github.sha }}`.
            Version source: `Cargo.toml`
            Resolved version: `v${{ needs.prepare.outputs.version }}`
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
