name: BoringTun Binary Build

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Build source: crates or git"
        required: true
        default: "crates"
        type: choice
        options:
          - crates
          - git
      boringtun_cli_version:
        description: "boringtun-cli crates.io version used when source=crates"
        required: true
        default: "0.7.1"
      boringtun_git_ref:
        description: "BoringTun git ref/tag/branch used when source=git"
        required: false
        default: "main"
  push:
    tags:
      - "boringtun-v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  BIN_NAME: boringtun-cli
  WINTUN_VERSION: "0.14.1"
  WINTUN_URL: "https://www.wintun.net/builds/wintun-0.14.1.zip"
  WINTUN_SHA256: "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"

jobs:
  build:
    name: boringtun-${{ matrix.id }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runs_on: windows-latest
            target: x86_64-pc-windows-msvc
            bin_ext: .exe
            archive_format: zip
            rustflags: -C target-feature=+crt-static
            wintun_arch: amd64
          - id: macos-x64
            runs_on: macos-15-intel
            target: x86_64-apple-darwin
            bin_ext: ""
            archive_format: tar.gz
            rustflags: ""
          - id: macos-arm64
            runs_on: macos-15
            target: aarch64-apple-darwin
            bin_ext: ""
            archive_format: tar.gz
            rustflags: ""

    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v6

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Resolve source mode
        id: meta
        run: |
          SOURCE="${{ github.event.inputs.source }}"
          VERSION="${{ github.event.inputs.boringtun_cli_version }}"
          GIT_REF="${{ github.event.inputs.boringtun_git_ref }}"

          if [[ -z "${SOURCE}" ]]; then SOURCE="crates"; fi
          if [[ -z "${VERSION}" ]]; then VERSION="0.6.0"; fi
          if [[ -z "${GIT_REF}" ]]; then GIT_REF="main"; fi

          if [[ "${SOURCE}" != "crates" && "${SOURCE}" != "git" ]]; then
            echo "Unsupported source: ${SOURCE}" >&2
            exit 1
          fi

          {
            echo "source=${SOURCE}"
            echo "version=${VERSION}"
            echo "git_ref=${GIT_REF}"
          } >> "${GITHUB_OUTPUT}"

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            upstream/boringtun/target/
          key: boringtun-${{ runner.os }}-${{ matrix.target }}-${{ steps.meta.outputs.source }}-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.git_ref }}
          restore-keys: |
            boringtun-${{ runner.os }}-${{ matrix.target }}-

      - name: Build from crates.io
        if: steps.meta.outputs.source == 'crates'
        env:
          CARGO_TERM_COLOR: always
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          rm -rf stage
          cargo install boringtun-cli \
            --version "${{ steps.meta.outputs.version }}" \
            --locked \
            --target "${{ matrix.target }}" \
            --root "${PWD}/stage"

          mkdir -p dist-bin
          cp "stage/bin/${BIN_NAME}${{ matrix.bin_ext }}" "dist-bin/${BIN_NAME}${{ matrix.bin_ext }}"

      - name: Build from cloudflare/boringtun git
        if: steps.meta.outputs.source == 'git'
        env:
          CARGO_TERM_COLOR: always
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          rm -rf upstream dist-bin
          git clone --depth 1 --branch "${{ steps.meta.outputs.git_ref }}" \
            https://github.com/cloudflare/boringtun.git upstream/boringtun

          cargo build \
            --manifest-path upstream/boringtun/Cargo.toml \
            --bin boringtun-cli \
            --release \
            --locked \
            --target "${{ matrix.target }}"

          mkdir -p dist-bin
          cp "upstream/boringtun/target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.bin_ext }}" \
            "dist-bin/${BIN_NAME}${{ matrix.bin_ext }}"

      - name: Smoke check binary
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./dist-bin/${BIN_NAME}.exe --help >/dev/null
          else
            chmod +x "dist-bin/${BIN_NAME}"
            ./dist-bin/${BIN_NAME} --help >/dev/null
          fi

      - name: Download and verify Wintun runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${env:WINTUN_VERSION}"
          $url = "${env:WINTUN_URL}"
          $expectedSha256 = "${env:WINTUN_SHA256}".ToLowerInvariant()
          $arch = "${{ matrix.wintun_arch }}"

          if ([string]::IsNullOrWhiteSpace($arch)) {
            throw "matrix.wintun_arch is required for Windows packaging"
          }

          $zipPath = Join-Path $PWD "wintun-$version.zip"
          $extractRoot = Join-Path $PWD "wintun-extracted"
          $runtimeRoot = Join-Path $PWD "dist-bin/wintun"

          Remove-Item -Recurse -Force $extractRoot -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $runtimeRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $runtimeRoot | Out-Null

          Write-Host "Downloading Wintun $version from $url"
          Invoke-WebRequest -Uri $url -OutFile $zipPath

          $actualSha256 = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Wintun SHA-256 mismatch. expected=$expectedSha256 actual=$actualSha256"
          }
          Write-Host "Wintun SHA-256 verified: $actualSha256"

          Expand-Archive -Path $zipPath -DestinationPath $extractRoot

          $dllSource = Join-Path $extractRoot "wintun/bin/$arch/wintun.dll"
          $headerSource = Join-Path $extractRoot "wintun/include/wintun.h"
          if (!(Test-Path $dllSource)) {
            throw "Expected Wintun DLL not found: $dllSource"
          }

          Copy-Item $dllSource (Join-Path $runtimeRoot "wintun.dll")
          if (Test-Path $headerSource) {
            Copy-Item $headerSource (Join-Path $runtimeRoot "wintun.h")
          }
          Copy-Item $zipPath (Join-Path $runtimeRoot "wintun-$version.zip")

          $manifest = @"
          version=$version
          url=$url
          sha256=$expectedSha256
          selected_arch=$arch
          selected_dll=wintun/wintun.dll
          original_archive=wintun/wintun-$version.zip
          "@
          $manifest.Trim() | Set-Content -Encoding ascii (Join-Path $runtimeRoot "WINTUN-MANIFEST.txt")

      - name: Package binary
        id: package
        run: |
          SOURCE="${{ steps.meta.outputs.source }}"
          VERSION="${{ steps.meta.outputs.version }}"
          GIT_REF="${{ steps.meta.outputs.git_ref }}"
          if [[ "${SOURCE}" == "crates" ]]; then
            VERSION_LABEL="v${VERSION}"
          else
            VERSION_LABEL="git-${GIT_REF//\//-}"
          fi

          PACKAGE_ROOT="package/${BIN_NAME}"
          ASSET_NAME="${BIN_NAME}-${VERSION_LABEL}-${{ matrix.id }}.${{ matrix.archive_format }}"
          mkdir -p "${PACKAGE_ROOT}" dist
          cp "dist-bin/${BIN_NAME}${{ matrix.bin_ext }}" "${PACKAGE_ROOT}/"
          if [[ "${{ runner.os }}" == "Windows" && -d "dist-bin/wintun" ]]; then
            cp -R "dist-bin/wintun" "${PACKAGE_ROOT}/"
            cp "dist-bin/wintun/wintun.dll" "${PACKAGE_ROOT}/wintun.dll"
          fi
          {
            echo "${BIN_NAME} binary package"
            echo "source=${SOURCE}"
            echo "version=${VERSION}"
            echo "git_ref=${GIT_REF}"
            echo "target=${{ matrix.target }}"
            echo ""
            echo "Runtime note:"
            echo "- macOS can run boringtun-cli as the upstream userspace WireGuard executable."
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              echo "- Windows package includes verified Wintun ${WINTUN_VERSION} runtime assets under ./wintun/."
              echo "- A convenience copy of wintun.dll is also placed beside boringtun-cli.exe for side-by-side loading."
              echo "- Wintun archive SHA-256: ${WINTUN_SHA256}"
            else
              echo "- Wintun is Windows-only and is not included in macOS artifacts."
            fi
          } > "${PACKAGE_ROOT}/README.txt"

          if [[ "${{ matrix.archive_format }}" == "zip" ]]; then
            (
              cd "${PACKAGE_ROOT}"
              7z a -tzip "${GITHUB_WORKSPACE}/dist/${ASSET_NAME}" ./*
            )
          else
            tar -C package -czf "dist/${ASSET_NAME}" "${BIN_NAME}"
          fi

          echo "asset_name=${ASSET_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: boringtun-${{ matrix.id }}
          path: dist/${{ steps.package.outputs.asset_name }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: release-boringtun-assets
    #    if: startsWith(github.ref, 'refs/tags/boringtun-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Show assets
        run: ls -lah release-assets

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
