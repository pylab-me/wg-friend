name: BoringTun Binary Build

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Build source: git tag/ref is recommended; crates is optional"
        required: true
        default: "git"
        type: choice
        options:
          - git
          - crates
      boringtun_cli_version:
        description: "boringtun-cli crates.io version used only when source=crates"
        required: true
        default: "0.7.1"
      boringtun_git_ref:
        description: "BoringTun git tag/ref used when source=git"
        required: false
        default: "boringtun-cli-0.7.1"
  push:
    tags:
      - "boringtun-v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  BIN_NAME: boringtun-cli
  WINTUN_VERSION: "0.14.1"
  WINTUN_URL: "https://www.wintun.net/builds/wintun-0.14.1.zip"
  WINTUN_SHA256: "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"

jobs:
  build:
    name: boringtun-${{ matrix.id }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runs_on: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin_ext: ""
            archive_format: tar.gz
            rustflags: "-C target-cpu=x86-64-v3"
            build_mode: docker
            docker_image: rust:1-alpine3.24

          - id: macos-x64
            runs_on: macos-15-intel
            target: x86_64-apple-darwin
            bin_ext: ""
            archive_format: tar.gz
            rustflags: ""
            build_mode: host
            docker_image: ""
          - id: macos-arm64
            runs_on: macos-15
            target: aarch64-apple-darwin
            bin_ext: ""
            archive_format: tar.gz
            rustflags: ""
            build_mode: host
            docker_image: ""
          # Windows is intentionally disabled for now.
          # Rationale: boringtun-cli 0.7.1 currently fails to compile on
          # x86_64-pc-windows-msvc in GitHub Actions. Do not keep a red release
          # workflow for an upstream/runtime boundary issue.
          #
          # Re-enable only after an upstream Windows-compatible tag is confirmed:
          # - id: windows-x64
          #   runs_on: windows-latest
          #   target: x86_64-pc-windows-msvc
          #   bin_ext: .exe
          #   archive_format: zip
          #   rustflags: -C target-feature=+crt-static
          #   build_mode: host
          #   docker_image: ""
          #   wintun_arch: amd64

    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v6

      - name: Install Rust target for host build
        if: matrix.build_mode == 'host'
        run: rustup target add ${{ matrix.target }}

      - name: Resolve source mode
        id: meta
        run: |
          SOURCE="${{ github.event.inputs.source }}"
          VERSION="${{ github.event.inputs.boringtun_cli_version }}"
          GIT_REF="${{ github.event.inputs.boringtun_git_ref }}"

          if [[ -z "${SOURCE}" ]]; then SOURCE="git"; fi
          if [[ -z "${VERSION}" ]]; then VERSION="0.7.1"; fi
          if [[ -z "${GIT_REF}" ]]; then GIT_REF="boringtun-cli-0.7.1"; fi

          if [[ "${SOURCE}" != "crates" && "${SOURCE}" != "git" ]]; then
            echo "Unsupported source: ${SOURCE}" >&2
            exit 1
          fi

          {
            echo "source=${SOURCE}"
            echo "version=${VERSION}"
            echo "git_ref=${GIT_REF}"
          } >> "${GITHUB_OUTPUT}"

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-docker/registry/index/
            .cargo-docker/registry/cache/
            .cargo-docker/git/db/
            stage/
            target/
            upstream/boringtun/target/
          key: boringtun-${{ runner.os }}-${{ matrix.target }}-${{ matrix.build_mode }}-${{ matrix.docker_image }}-${{ steps.meta.outputs.source }}-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.git_ref }}
          restore-keys: |
            boringtun-${{ runner.os }}-${{ matrix.target }}-${{ matrix.build_mode }}-
            boringtun-${{ runner.os }}-${{ matrix.target }}-

      - name: Checkout cloudflare/boringtun git tag/ref
        if: steps.meta.outputs.source == 'git'
        run: |
          rm -rf upstream/boringtun
          GIT_REF="${{ steps.meta.outputs.git_ref }}"

          git init upstream/boringtun
          cd upstream/boringtun
          git remote add origin https://github.com/cloudflare/boringtun.git
          if ! git fetch --depth 1 origin "${GIT_REF}"; then
            git fetch --depth 1 origin "refs/tags/${GIT_REF}:refs/tags/${GIT_REF}"
          fi
          git checkout --detach FETCH_HEAD
          cd "${GITHUB_WORKSPACE}"

      - name: Build from crates.io on host
        if: steps.meta.outputs.source == 'crates' && matrix.build_mode == 'host'
        env:
          CARGO_TERM_COLOR: always
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          rm -rf stage dist-bin
          cargo install boringtun-cli \
            --version "${{ steps.meta.outputs.version }}" \
            --locked \
            --target "${{ matrix.target }}" \
            --root "${PWD}/stage"

          mkdir -p dist-bin
          cp "stage/bin/${BIN_NAME}${{ matrix.bin_ext }}" "dist-bin/${BIN_NAME}${{ matrix.bin_ext }}"

      - name: Build from crates.io in Docker
        if: steps.meta.outputs.source == 'crates' && matrix.build_mode == 'docker'
        env:
          CARGO_TERM_COLOR: always
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          rm -rf stage dist-bin
          mkdir -p .cargo-docker .docker-home stage dist-bin

          docker run --rm \
            -e HOME=/work/.docker-home \
            -e CARGO_HOME=/work/.cargo-docker \
            -e CARGO_TERM_COLOR=always \
            -e RUSTFLAGS="${RUSTFLAGS}" \
            -e CC_x86_64_unknown_linux_musl=x86_64-linux-musl-gcc \
            -e CC_x86_64_unknown_linux_musl=cc \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            "${{ matrix.docker_image }}" \
            sh -lc 'set -euo pipefail
              apk update
              apk add --no-cache ca-certificates build-base musl-dev perl
              rustup target add "${{ matrix.target }}"
              cargo install boringtun-cli --version "${{ steps.meta.outputs.version }}" --locked --target "${{ matrix.target }}" --root /work/stage'

          sudo chown -R "$(id -u):$(id -g)" .cargo-docker .docker-home stage
          cp "stage/bin/${BIN_NAME}${{ matrix.bin_ext }}" "dist-bin/${BIN_NAME}${{ matrix.bin_ext }}"

      - name: Build from cloudflare/boringtun git tag/ref on host
        if: steps.meta.outputs.source == 'git' && matrix.build_mode == 'host'
        env:
          CARGO_TERM_COLOR: always
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          rm -rf dist-bin
          cargo build \
            --manifest-path upstream/boringtun/Cargo.toml \
            --bin boringtun-cli \
            --release \
            --locked \
            --target "${{ matrix.target }}"

          mkdir -p dist-bin
          cp "upstream/boringtun/target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.bin_ext }}" \
            "dist-bin/${BIN_NAME}${{ matrix.bin_ext }}"

      - name: Build from cloudflare/boringtun git tag/ref in Docker
        if: steps.meta.outputs.source == 'git' && matrix.build_mode == 'docker'
        env:
          CARGO_TERM_COLOR: always
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          rm -rf dist-bin
          mkdir -p .cargo-docker .docker-home dist-bin

          docker run --rm \
            -e CARGO_TERM_COLOR=always \
            -e RUSTFLAGS="${RUSTFLAGS}" \
            -e CC_x86_64_unknown_linux_musl=cc \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            "rust:1-alpine3.24" \
            sh -lc 'set -euo pipefail
              export PATH="/usr/local/cargo/bin:${PATH}"
          
              apk add --no-cache ca-certificates build-base musl-dev perl
          
              cargo --version
              rustc --version
          
              cargo build \
                --manifest-path upstream/boringtun/Cargo.toml \
                --bin boringtun-cli \
                --release \
                --locked \
                --target "x86_64-unknown-linux-musl"
            '

          sudo chown -R "$(id -u):$(id -g)" upstream

          cp "upstream/boringtun/target/x86_64-unknown-linux-musl/release/${BIN_NAME}" \
            "dist-bin/${BIN_NAME}"

      - name: Smoke check binary
        run: |
          chmod +x "dist-bin/${BIN_NAME}${{ matrix.bin_ext }}"
          ./dist-bin/${BIN_NAME}${{ matrix.bin_ext }} --help >/dev/null

      - name: Package binary
        id: package
        run: |
          SOURCE="${{ steps.meta.outputs.source }}"
          VERSION="${{ steps.meta.outputs.version }}"
          GIT_REF="${{ steps.meta.outputs.git_ref }}"
          if [[ "${SOURCE}" == "crates" ]]; then
            VERSION_LABEL="crates-v${VERSION}"
          else
            VERSION_LABEL="git-${GIT_REF//\//-}"
          fi

          PACKAGE_ROOT="package/${BIN_NAME}"
          ASSET_NAME="${BIN_NAME}-${VERSION_LABEL}-${{ matrix.id }}.${{ matrix.archive_format }}"
          mkdir -p "${PACKAGE_ROOT}" dist
          cp "dist-bin/${BIN_NAME}${{ matrix.bin_ext }}" "${PACKAGE_ROOT}/"
          {
            echo "${BIN_NAME} binary package"
            echo "source=${SOURCE}"
            echo "version=${VERSION}"
            echo "git_ref=${GIT_REF}"
            echo "target=${{ matrix.target }}"
            echo "build_mode=${{ matrix.build_mode }}"
            echo "docker_image=${{ matrix.docker_image }}"
            echo "rustflags=${{ matrix.rustflags }}"
            echo ""
            echo "Runtime note:"
            echo "- Linux x64 is built in the official rust:trixie Docker image; musl-tools is installed inside the container to provide x86_64-linux-musl-gcc for ring/cc-rs."
            echo "- macOS x64/arm64 are built on native GitHub macOS runners."
            echo "- Windows packaging is intentionally disabled until an upstream Windows-compatible boringtun-cli tag is confirmed."
          } > "${PACKAGE_ROOT}/README.txt"

          tar -C package -czf "dist/${ASSET_NAME}" "${BIN_NAME}"
          echo "asset_name=${ASSET_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: boringtun-${{ matrix.id }}
          path: dist/${{ steps.package.outputs.asset_name }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: release-boringtun-assets
    #    if: startsWith(github.ref, 'refs/tags/boringtun-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Show assets
        run: ls -lah release-assets

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
