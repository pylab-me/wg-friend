[package]
name = "wg-friend"
version = "0.4.7"
edition = "2024"
description = "Semantic WireGuard/BoringTun lifecycle and client helper"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fast_qr = { version = "0.14", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
debug = false
